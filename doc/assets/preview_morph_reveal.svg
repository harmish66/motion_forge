<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="100%" height="100%">
  <rect width="480" height="240" fill="#0B1329" rx="8"/>
  <!-- Circle Reveal -->
  <g transform="translate(40, 50)">
    <rect width="110" height="130" rx="8" fill="#1E293B"/>
    <circle cx="55" cy="65" r="40" fill="#0284C7" opacity="0.8"/>
    <text x="55" y="115" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Circle</text>
  </g>
  <!-- Wipe Reveal -->
  <g transform="translate(185, 50)">
    <rect width="110" height="130" rx="8" fill="#1E293B"/>
    <rect x="0" y="0" width="70" height="130" rx="8" fill="#0284C7" opacity="0.8"/>
    <text x="55" y="115" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Wipe</text>
  </g>
  <!-- Diamond Reveal -->
  <g transform="translate(330, 50)">
    <rect width="110" height="130" rx="8" fill="#1E293B"/>
    <polygon points="55,25 95,65 55,105 15,65" fill="#0284C7" opacity="0.8"/>
    <text x="55" y="115" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Diamond</text>
  </g>
</svg>

