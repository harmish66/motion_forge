<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="100%" height="100%">
  <rect width="480" height="240" fill="#0B1329" rx="8"/>
  <g transform="translate(240, 120)">
    <!-- Concentric ripple rings -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#0284C7" stroke-width="1.5" opacity="0.15"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#0284C7" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.8"/>
    <!-- Center node -->
    <circle cx="0" cy="0" r="24" fill="#0284C7"/>
    <!-- Mic/Beacon inner icon representation -->
    <rect x="-6" y="-10" width="12" height="14" rx="6" fill="#FFFFFF"/>
    <path d="M -9 -2 C -9 6, 9 6, 9 -2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="0" y1="6" x2="0" y2="10" stroke="#FFFFFF" stroke-width="2"/>
