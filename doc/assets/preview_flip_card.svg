<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="100%" height="100%">
  <rect width="480" height="240" fill="#0B1329" rx="8"/>
  <!-- Front card -->
  <g transform="translate(40, 45)">
    <rect width="180" height="150" rx="12" fill="#0284C7" stroke="#38BDF8" stroke-width="1"/>
    <text x="20" y="45" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Front View</text>
    <text x="20" y="75" fill="#E0F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Initial face</text>
    <line x1="20" y1="120" x2="160" y2="120" stroke="#7DD3FC" stroke-width="2"/>
  </g>
  <!-- Flip rotation indicator arrow -->
  <path d="M 235 120 C 240 100, 240 90, 245 80" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="245,76 248,88 238,84" fill="#94A3B8"/>
  <!-- Back card -->
  <g transform="translate(260, 45)">
    <rect width="180" height="150" rx="12" fill="#0F172A" stroke="#475569" stroke-width="1"/>
    <text x="20" y="45" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Back View</text>
    <text x="20" y="75" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">180 degree flip</text>
    <rect x="20" y="110" width="60" height="16" rx="4" fill="#1E293B"/>
    <text x="28" y="122" fill="#38BDF8" font-family="monospace" font-size="10">Active</text>
  </g>
</svg>

