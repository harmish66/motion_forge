<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="100%" height="100%">
  <rect width="480" height="240" fill="#0B1329" rx="8"/>
  <g transform="translate(60, 40)">
    <!-- Axis lines -->
    <line x1="40" y1="140" x2="340" y2="140" stroke="#334155" stroke-width="1.5"/>
    <line x1="40" y1="20" x2="40" y2="140" stroke="#334155" stroke-width="1.5"/>
    <!-- Target baseline -->
    <line x1="40" y1="60" x2="340" y2="60" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="345" y="64" fill="#64748B" font-family="monospace" font-size="10">Target 1.0</text>
    <!-- Realistic spring damping curve -->
    <path d="M 40 140 C 70 20, 110 30, 140 75 C 170 100, 200 50, 230 65 C 260 72, 280 57, 300 60 L 340 60" fill="none" stroke="#0284C7" stroke-width="2.5"/>
    <text x="50" y="170" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">SpringSimulation: mass = 1.0, stiffness = 180.0, damping = 12.0</text>
  </g>
</svg>

