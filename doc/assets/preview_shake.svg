<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="100%" height="100%">
  <rect width="480" height="240" fill="#0B1329" rx="8"/>
  <g transform="translate(90, 70)">
    <!-- Motion trails -->
    <rect x="-12" y="0" width="300" height="60" rx="8" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.2"/>
    <rect x="12" y="0" width="300" height="60" rx="8" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.3"/>
    <!-- Main alert card -->
    <rect x="0" y="0" width="300" height="60" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="2"/>
    <circle cx="35" cy="30" r="12" fill="#FEE2E2"/>
    <text x="35" y="35" text-anchor="middle" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold">!</text>
    <text x="60" y="35" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Validation feedback</text>
  </g>
  <!-- Sinusoidal decay curve -->
  <path d="M 120 180 Q 150 160, 180 180 T 240 180 T 300 180 T 340 180" fill="none" stroke="#EF4444" stroke-width="2"/>
  <text x="240" y="210" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Decaying sinusoidal oscillation</text>
</svg>

