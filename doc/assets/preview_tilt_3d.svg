<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="100%" height="100%">
  <rect width="480" height="240" fill="#0B1329" rx="8"/>
  <g transform="translate(60, 40)">
    <!-- Flat background shadow -->
    <rect x="20" y="30" width="320" height="130" rx="12" fill="#000000" opacity="0.3"/>
    <!-- 3D Tilted Card with matrix perspective illusion -->
    <polygon points="35,15 340,30 325,150 20,135" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Glare overlay -->
    <polygon points="35,15 200,22 150,140 20,135" fill="white" opacity="0.08"/>
    <!-- Card content -->
    <text x="60" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">MotionTilt3D</text>
    <text x="60" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Interactive 3D matrix transform</text>
    <rect x="60" y="105" width="120" height="20" rx="4" fill="#1E293B"/>
    <text x="70" y="119" fill="#38BDF8" font-family="monospace" font-size="10">Matrix4.setEntry</text>
  </g>
</svg>

